<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }
        </script><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive JavaScript Playground</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Interactive JavaScript Playground 🎉</h1>

        <!-- Interactive Button -->
        <section>
            <h2>1. Magic Button ✨</h2>
            <button id="magicButton">Click Me!</button>
            <p id="buttonStatus">Try clicking, hovering, or double-clicking!</p>
        </section>

        <!-- Image Gallery -->
        <section>
            <h2>2. Image Gallery 📸</h2>
            <div class="gallery">
                <img id="galleryImage" src="https://via.placeholder.com/400x300?text=Image+1" alt="Gallery Image">
                <div class="gallery-controls">
                    <button id="prevImage">Previous</button>
                    <button id="nextImage">Next</button>
                </div>
            </div>
        </section>

        <!-- Tabs -->
        <section>
            <h2>3. Content Tabs 📑</h2>
            <div class="tabs">
                <div class="tab-buttons">
                    <button class="tab-button active" data-tab="tab1">Tab 1</button>
                    <button class="tab-button" data-tab="tab2">Tab 2</button>
                    <button class="tab-button" data-tab="tab3">Tab 3</button>
                </div>
                <div class="tab-content">
                    <div id="tab1" class="tab-pane active">Welcome to Tab 1! This is some cool content.</div>
                    <div id="tab2" class="tab-pane">Tab 2 has even cooler content!</div>
                    <div id="tab3" class="tab-pane">Tab 3 is the coolest of them all!</div>
                </div>
            </div>
        </section>

        <!-- Form Validation -->
        <section>
            <h2>4. Form Validation 📋</h2>
            <form id="userForm">
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" required>
                    <span class="error" id="nameError"></span>
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" required>
                    <span class="error" id="emailError"></span>
                </div>
                <div class="form-group">
                    <label for="password">Password (min 8 chars):</label>
                    <input type="password" id="password" required>
                    <span class="error" id="passwordError"></span>
                </div>
                <button type="submit">Submit</button>
            </form>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
